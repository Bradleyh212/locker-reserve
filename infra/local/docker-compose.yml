services:
  db:
    image: postgres:16
    container_name: locker_db
    environment:
      POSTGRES_USER: locker
      POSTGRES_PASSWORD: locker
      POSTGRES_DB: locker
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locker -d locker"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - locker_pgdata:/var/lib/postgresql/data

  redis:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    image: redis:7-alpine
    container_name: locker_redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  locker_pgdata:
