name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/locker_ci?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-not-a-real-signing-secret
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder_not_a_real_secret
      DEVICE_MAX_PULSE_MS: '5000'
      RUN_DEVICE_DB_TESTS: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: locker_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d locker_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npx --no-install prisma generate
      - run: npx --no-install prisma migrate deploy
      - name: Unit and device HTTP/database tests
        run: npm test -- --ci --runInBand
      - name: Application HTTP smoke tests
        run: npm run test:e2e -- --ci --runInBand
      - run: npm run build

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/web
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder_not_a_real_key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: TypeScript
        run: npx --no-install tsc --noEmit
      - run: npm run build

  firmware:
    name: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARDUINO_CORE_VERSION: 3.3.12
      ARDUINO_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Host tests and simulator
        run: sh firmware/scripts/run-host.sh
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: 1.5.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.arduino15
          key: arduino-${{ runner.os }}-${{ runner.arch }}-cli-1.5.1-esp32-${{ env.ARDUINO_CORE_VERSION }}-v1
      - name: Install pinned ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "$ARDUINO_INDEX_URL"
          arduino-cli core install "esp32:esp32@$ARDUINO_CORE_VERSION" --additional-urls "$ARDUINO_INDEX_URL"
      - name: Compile main firmware and diagnostics without private config
        run: python3 scripts/ci-firmware.py

  dev-tooling:
    name: dev-tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Shell syntax
        run: |
          for script in scripts/*.sh firmware/scripts/*.sh; do sh -n "$script"; done
      - name: Python syntax and supervisor tests
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/test-dev-supervisor.py
      - name: Node helper syntax and tests
        run: |
          for script in scripts/*.cjs services/api/scripts/*.cjs; do node --check "$script"; done
          node --test scripts/dev-fetch-timeout.test.cjs
      - name: Local Compose syntax (no services started)
        run: docker compose -f infra/local/docker-compose.yml config --quiet
