name: Release candidates
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing vMAJOR.MINOR.PATCH tag pointing at the selected main commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag against dispatched commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/main
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$ ]]
          test "$(git rev-parse --verify "refs/tags/$VERSION^{commit}")" = "$GITHUB_SHA"

  images:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and export one Linux image
        env:
          VERSION: ${{ inputs.version }}
          SERVICE: ${{ matrix.service }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.RELEASE_PUBLIC_API_BASE_URL || 'https://api.invalid' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.RELEASE_PUBLIC_STRIPE_KEY || 'pk_test_ci_placeholder' }}
        run: |
          set -euo pipefail
          image="locker-reserve/$SERVICE"
          args=()
          if [[ "$SERVICE" == web ]]; then
            args+=(--build-arg NEXT_PUBLIC_API_BASE_URL --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY)
          fi
          docker build --platform linux/amd64 "${args[@]}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$image:$VERSION" --tag "$image:sha-$GITHUB_SHA" "services/$SERVICE"
          mkdir export
          cd export
          file="$SERVICE-$VERSION-$GITHUB_SHA.tar.gz"
          docker save "$image:$VERSION" "$image:sha-$GITHUB_SHA" | gzip -n > "$file"
          sha256sum "$file" > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.service }}-${{ inputs.version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: export/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  firmware:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: 1.5.1
      - name: Build application binary and inventory
        env:
          VERSION: ${{ inputs.version }}
        run: |
          arduino-cli core update-index --additional-urls "$INDEX_URL"
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$INDEX_URL"
          python3 scripts/package-firmware.py "$VERSION" export
          (cd export && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-${{ inputs.version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: export/
          if-no-files-found: error
          retention-days: 14
